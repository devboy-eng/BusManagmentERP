development:
  process_scheduled_follow_ups:
    class: ProcessScheduledFollowUpsJob
    schedule: every 1 minute
  process_scheduled_messages:
    class: ProcessScheduledMessagesJob
    schedule: every 1 minute
  process_follow_up_campaigns:
    class: ProcessFollowUpCampaignsJob
    schedule: every 1 minute
  sync_whatsapp_quality:
    class: SyncWhatsappQualityJob
    schedule: every 6 hours

production:
  process_scheduled_follow_ups:
    class: ProcessScheduledFollowUpsJob
    schedule: every 1 minute
  process_scheduled_messages:
    class: ProcessScheduledMessagesJob
    schedule: every 1 minute
  process_follow_up_campaigns:
    class: ProcessFollowUpCampaignsJob
    schedule: every 1 minute
  sync_whatsapp_quality:
    class: SyncWhatsappQualityJob
    schedule: every 6 hours
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
